// Donut ring para attainment %
function Ring({ p, size=72, stroke=7 }) {
  const color = pc(p);
  const r = (size - stroke) / 2;
  const circ = 2 * Math.PI * r;
  const capped = Math.min(p, 100);
  const offset = circ - (capped / 100) * circ;
  return (
    <div style={{position:"relative",width:size,height:size,flexShrink:0}}>
      <svg width={size} height={size} style={{transform:"rotate(-90deg)"}}>
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={P.bg2} strokeWidth={stroke}/>
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={color} strokeWidth={stroke}
          strokeDasharray={circ} strokeDashoffset={offset} strokeLinecap="round"
          style={{transition:"stroke-dashoffset .6s ease"}}/>
      </svg>
      <div style={{position:"absolute",inset:0,display:"flex",alignItems:"center",justifyContent:"center",
        fontSize:size>60?13:11,fontWeight:700,color}}>
        {p}%
      </div>
    </div>
  );
}

// Barra horizontal con label
function HBar({ value, max, color=P.blue, height=10, label }) {
  const w = max>0 ? Math.min((value/max)*100, 100) : 0;
  return (
    <div style={{width:"100%"}}>
      {label && <div style={{fontSize:10,color:P.muted,marginBottom:3}}>{label}</div>}
      <div style={{background:P.bg2,borderRadius:99,height,overflow:"hidden"}}>
        <div style={{width:`${w}%`,height:"100%",background:color,borderRadius:99,transition:"width .5s ease"}}/>
      </div>
    </div>
  );
}

// Badge de status
function Badge({ p }) {
  return (
    <span style={{display:"inline-block",padding:"2px 8px",borderRadius:10,fontSize:11,fontWeight:700,
      background:pcBg(p), color:pc(p)}}>
      {p}%
    </span>
  );
}

// Gauge semicircular para score
function SemiGauge({ score, max, size=140 }) {
  const p = Math.min(score/max, 1);
  const color = score>=60 ? P.green : score>=30 ? P.yellow : P.red;
  const r = size/2 - 10;
  const cx = size/2, cy = size/2 + 10;
  const startAngle = Math.PI;
  const endAngle = startAngle + p * Math.PI;
  const x1 = cx + r * Math.cos(startAngle), y1 = cy + r * Math.sin(startAngle);
  const x2 = cx + r * Math.cos(endAngle),   y2 = cy + r * Math.sin(endAngle);
  const large = p > 0.5 ? 1 : 0;
  const bx1 = cx + r * Math.cos(startAngle), by1 = cy + r * Math.sin(startAngle);
  const bx2 = cx + r * Math.cos(Math.PI*2),  by2 = cy + r * Math.sin(Math.PI*2);
  return (
    <div style={{textAlign:"center"}}>
      <svg width={size} height={size/2+20} overflow="visible">
        <path d={`M ${cx-r} ${cy} A ${r} ${r} 0 0 1 ${cx+r} ${cy}`}
          fill="none" stroke={P.bg2} strokeWidth={12} strokeLinecap="round"/>
        {p>0 && <path d={`M ${x1} ${y1} A ${r} ${r} 0 ${large} 1 ${x2} ${y2}`}
          fill="none" stroke={color} strokeWidth={12} strokeLinecap="round"
          style={{transition:"all .6s ease"}}/>}
        <text x={cx} y={cy-4} textAnchor="middle" fontSize={22} fontWeight={800} fill={color}>{Math.round(score)}</text>
        <text x={cx} y={cy+14} textAnchor="middle" fontSize={11} fill={P.muted}>de {max}</text>
      </svg>
    </div>
  );
}

const SAPLogo = ({ size=36 }) => (
  <img src={SAP_LOGO_URI} alt="SAP" style={{height:size, width:"auto", display:"block"}}/>
);

// ── UI BASE ───────────────────────────────────────────────────
const Th = ({c,align="left",children}) => (
  <th style={{background:c||P.dark,color:"#fff",padding:"8px 12px",textAlign:align,
    fontSize:11,fontWeight:600,whiteSpace:"nowrap",letterSpacing:.3}}>{children}</th>
);
const Td = ({children,style={}}) => (
  <td style={{padding:"9px 12px",borderBottom:`1px solid ${P.border}`,fontSize:12,
    verticalAlign:"middle",...style}}>{children}</td>
);
const Card = ({children,style={}}) => (
  <div style={{background:P.white,border:`1px solid ${P.border}`,borderRadius:10,
    padding:20,marginBottom:16,boxShadow:"0 1px 4px rgba(0,0,0,.06)",...style}}>{children}</div>
);
const H2 = ({children,style={}}) => (
  <h3 style={{margin:"0 0 14px",fontSize:14,fontWeight:700,color:P.dark,
    letterSpacing:.2,...style}}>{children}</h3>
);
const Inp = ({style={},value,onChange,type="number",placeholder=""}) => (
  <input type={type} value={value} onChange={onChange} placeholder={placeholder}
    style={{border:`1px solid ${P.border}`,borderRadius:6,padding:"5px 8px",width:80,
      fontSize:12,textAlign:type==="number"?"right":"left",outline:"none",
      transition:"border-color .2s",background:P.white,...style}}/>
);
const Sel = ({value,onChange,children,style={}}) => (
  <select value={value} onChange={onChange}
    style={{border:`1px solid ${P.border}`,borderRadius:6,padding:"5px 8px",fontSize:11,
      outline:"none",background:P.white,cursor:"pointer",...style}}>
    {children}
  </select>
);

// Tile KPI grande
function KpiTile({ label, value, sub, color, accent }) {
  return (
    <div style={{background:P.white,border:`1px solid ${P.border}`,borderRadius:10,
      padding:"16px 18px",textAlign:"center",boxShadow:"0 1px 4px rgba(0,0,0,.06)",
      borderTop:`3px solid ${accent||color}`}}>
      <div style={{fontSize:10,color:P.muted,fontWeight:600,marginBottom:6,
        textTransform:"uppercase",letterSpacing:.5}}>{label}</div>
      <div style={{fontSize:22,fontWeight:800,color:color||P.dark}}>{value}</div>
      <div style={{fontSize:11,color:P.muted,marginTop:4}}>{sub}</div>
    </div>
  );
}

// ── YTD ───────────────────────────────────────────────────────
function YTDTab() {
  return (
    <>
      {/* Rings de resumen */}
      <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:12,marginBottom:16}}>
        {YTD_ROWS.map(r => {
          const ytdp = pct(r.ytda, r.ytdq);
          return (
            <Card key={r.m} style={{display:"flex",alignItems:"center",gap:16,padding:16}}>
              <Ring p={ytdp} size={80} stroke={8}/>
              <div>
                <div style={{fontWeight:700,fontSize:15,color:P.dark}}>{r.m}</div>
                <div style={{fontSize:12,color:P.muted,marginTop:2}}>
                  <b style={{color:P.text}}>{n(r.ytda)}k</b> / {n(r.ytdq)}k YTD
                </div>
                <div style={{marginTop:8}}>
                  <HBar value={r.ytda} max={r.ytdq} color={pc(ytdp)} height={6}/>
                </div>
              </div>
            </Card>
          );
        })}
      </div>

      <Card>
        <H2>2026 YTD — Detalle por Quarter</H2>
        <div style={{overflowX:"auto"}}>
          <table style={{width:"100%",borderCollapse:"collapse"}}>
            <thead><tr>
              {["","Q1 Quota","Q1 Act","Q1 %","Q2 Quota","Q2 Act","Q2 %","Q3 Quota","Q3 Act","Q3 %","YTD Quota","YTD Act","YTD %"]
                .map(h=><Th key={h}>{h}</Th>)}
            </tr></thead>
            <tbody>
              {YTD_ROWS.map(r => {
                const [q1p,q2p,q3p,ytdp] = [pct(r.q1a,r.q1q),pct(r.q2a,r.q2q),pct(r.q3a,r.q3q),pct(r.ytda,r.ytdq)];
                return (
                  <tr key={r.m}>
                    <Td style={{fontWeight:700}}>{r.m}</Td>
                    <Td>{n(r.q1q)}</Td><Td>{n(r.q1a)}</Td>
                    <Td><Badge p={q1p}/></Td>
                    <Td>{n(r.q2q)}</Td><Td>{n(r.q2a)}</Td>
                    <Td><Badge p={q2p}/></Td>
                    <Td>{n(r.q3q)}</Td><Td>{n(r.q3a)}</Td>
                    <Td><Badge p={q3p}/></Td>
                    <Td style={{fontWeight:600}}>{n(r.ytdq)}</Td>
                    <Td style={{fontWeight:700}}>{n(r.ytda)}</Td>
                    <Td><Badge p={ytdp}/></Td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      </Card>

      {/* Progress bars de Q1-Q3 */}
      <Card>
        <H2>Attainment Visual Q1 → Q3 (N&U)</H2>
        {[
          {l:"Q1 2026", a:0,   q:280},
          {l:"Q2 2026", a:83,  q:380},
          {l:"Q3 2026", a:430, q:460},
          {l:"YTD",     a:513, q:1120},
        ].map(({l,a,q}) => {
          const p = pct(a,q);
          return (
            <div key={l} style={{marginBottom:14}}>
              <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}>
                <span style={{fontSize:12,fontWeight:600}}>{l}</span>
                <span style={{fontSize:12,color:P.muted}}>{n(a)}k / {n(q)}k — <b style={{color:pc(p)}}>{p}%</b></span>
              </div>
              <HBar value={a} max={q} color={pc(p)} height={12}/>
            </div>
          );
        })}
      </Card>
    </>
  );
}

// ── FORECAST ─────────────────────────────────────────────────
function ForecastTab({ title, rows, inputs, setInputs, showLinearity=false }) {
  const upd    = (key,f,v) => setInputs(p=>({...p,[key]:{...p[key],[f]:+v||0}}));
  const updLin = (f,v)     => setInputs(p=>({...p,lin:{...p.lin,[f]:+v||0}}));
  const lin    = inputs.lin || {};
  const verbal = inputs.nnu?.verbal || 0;

  return (
    <>
      {/* Rings de forecast */}
      <div style={{display:"grid",gridTemplateColumns:`repeat(${rows.length},1fr)`,gap:12,marginBottom:16}}>
        {rows.map(r => {
          const v = inputs[r.key]?.verbal || 0;
          const p = pct(v, r.quota);
          return (
            <Card key={r.key} style={{display:"flex",alignItems:"center",gap:16,padding:16}}>
              <Ring p={p} size={76} stroke={8}/>
              <div>
                <div style={{fontWeight:700,fontSize:14}}>{r.label}</div>
                <div style={{fontSize:11,color:P.muted,marginTop:2}}>Quota: {n(r.quota)}k</div>
                <div style={{fontSize:12,marginTop:4}}>
                  Verbal: <b style={{color:p>=100?P.green:p>=70?P.yellow:P.red}}>{n(v)}k</b>
                </div>
              </div>
            </Card>
          );
        })}
      </div>

      <Card>
        <H2>{title}</H2>
        <p style={{fontSize:11,color:P.muted,margin:"-10px 0 14px"}}>💡 Ingresá Low, Verbal y High — el % y Gap se calculan solos</p>
        <div style={{overflowX:"auto"}}>
          <table style={{width:"100%",borderCollapse:"collapse"}}>
            <thead><tr>
              {["Métrica","Quota","Low","Verbal","High","Progreso","% vs Q","Gap"].map(h=><Th key={h}>{h}</Th>)}
            </tr></thead>
            <tbody>
              {rows.map(r => {
                const {low=0,verbal=0,high=0} = inputs[r.key]||{};
                const p = pct(verbal, r.quota), gap = verbal - r.quota;
                return (
                  <tr key={r.key}>
                    <Td style={{fontWeight:700}}>
                      {r.label}
                      {r.note && <div style={{fontSize:10,color:P.muted}}>{r.note}</div>}
                    </Td>
                    <Td style={{fontWeight:600}}>{n(r.quota)}</Td>
                    <Td><Inp value={low}    onChange={e=>upd(r.key,"low",e.target.value)}/></Td>
                    <Td><Inp value={verbal} onChange={e=>upd(r.key,"verbal",e.target.value)}/></Td>
                    <Td><Inp value={high}   onChange={e=>upd(r.key,"high",e.target.value)}/></Td>
                    <Td style={{minWidth:120}}>
                      <HBar value={verbal} max={r.quota} color={pc(p)} height={8}/>
                    </Td>
                    <Td><Badge p={p}/></Td>
                    <Td style={{fontWeight:700,color:gap>=0?P.green:P.red}}>
                      {gap>=0?"+":""}{n(gap)}
                    </Td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      </Card>

      {showLinearity && (
        <Card>
          <H2>Linearity Q4 — Distribución por Período (k USD)</H2>
          <div style={{display:"grid",gridTemplateColumns:"repeat(5,1fr)",gap:10,marginBottom:14}}>
            {[["M1","m1"],["M2","m2"],["SC","sc"],["LW","lw"],["QE","qe"]].map(([lbl,f]) => {
              const v  = lin[f]||0;
              const lp = verbal>0 ? Math.round((v/verbal)*100) : 0;
              const isLW = f==="lw", isQE = f==="qe";
              return (
                <div key={f} style={{border:`1px solid ${P.border}`,borderRadius:8,padding:14,textAlign:"center",
                  background:isQE?P.bg2:P.white, borderTop:`3px solid ${isLW||isQE?P.yellow:P.blue}`}}>
                  <div style={{fontSize:11,color:P.muted,fontWeight:700,marginBottom:8}}>{lbl}</div>
                  <Inp style={{width:"100%",fontSize:16,textAlign:"center",fontWeight:700}} value={v}
                    onChange={e=>updLin(f,e.target.value)}/>
                  <div style={{marginTop:8}}>
                    <HBar value={v} max={verbal||1} color={isLW||isQE?P.yellow:P.blue} height={6}/>
                    <div style={{fontSize:10,color:P.muted,marginTop:4,fontWeight:600}}>{lp}% de Verbal</div>
                  </div>

// ── GAME PLAN ─────────────────────────────────────────────────
function GPTab({ gp, setGp }) {
  const add = bk => setGp(p=>[...p,{id:Date.now(),q:"Q4",account:"",partner:"",sol:"",usd:0,bk}]);
  const upd = (id,f,v) => setGp(p=>p.map(d=>d.id===id?{...d,[f]:f==="usd"?+v||0:v}:d));

  const main=gp.filter(d=>!d.bk), bk=gp.filter(d=>d.bk);
  const totM=main.reduce((a,d)=>a+d.usd,0), totB=bk.reduce((a,d)=>a+d.usd,0);

              <Td><Inp style={{width:150}} type="text" value={d.sol}     onChange={e=>upd(d.id,"sol",e.target.value)}/></Td>
              <Td><Inp value={d.usd} onChange={e=>upd(d.id,"usd",e.target.value)}/></Td>

              </Td>

        <KpiTile label="Backup Pipeline" value={`${n(totB)}k`}
          sub={`${main.length+bk.filter(d=>d.bk).length} deals totales`} color={P.muted} accent="#6c757d"/>
        <KpiTile label="FY Quota" value={`${n(FY_QUOTA)}k`}
          sub={`Gap: ${n(totM-FY_QUOTA)}k`} color={P.dark} accent={P.dark}/>
      </div>

      <Card>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
          <H2 style={{margin:0}}>Game Plan FY — Deals Principales</H2>
          <span style={{fontSize:12,color:P.muted}}>
            <b style={{color:pc(pct(totM,FY_QUOTA)),fontSize:14}}>{n(totM)}k</b> / {n(FY_QUOTA)}k

        <div style={{marginBottom:14}}>

      <Card>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
          <H2 style={{margin:0}}>Backup Deals</H2>
          <span style={{fontSize:12,color:P.muted}}>Total: <b>{n(totB)}k</b></span>

// ── ROADMAP TO CLOSE ─────────────────────────────────────────
function RTCTab({ rtc, setRtc }) {
  const [sel, setSel] = useState(rtc[0].id);
  const d = rtc.find(x=>x.id===sel);

  const upd    = (f,v)   => setRtc(p=>p.map(x=>x.id===sel?{...x,[f]:v}:x));
  const updS   = (k,v)   => setRtc(p=>p.map(x=>x.id===sel?{...x,strat:{...x.strat,[k]:+v}}:x));
  const updO   = (k,v)   => setRtc(p=>p.map(x=>x.id===sel?{...x,oper:{...x.oper,[k]:+v}}:x));
  const updR   = (k,v)   => setRtc(p=>p.map(x=>x.id===sel?{...x,rel:{...x.rel,[k]:v}}:x));
  const addRow = ()      => setRtc(p=>p.map(x=>x.id===sel?{...x,roadmap:[...x.roadmap,{date:"",topic:"",activity:"",owner:"",status:""}]}:x));
  const updRM  = (i,f,v) => setRtc(p=>p.map(x=>{
    if(x.id!==sel) return x;
    const r=[...x.roadmap]; r[i]={...r[i],[f]:v}; return {...x,roadmap:r};
  }));

  const ss = Object.values(d.strat).reduce((a,v)=>a+v,0);
  const os = Object.values(d.oper).reduce((a,v)=>a+v,0);
  const ts = ss+os, MAX=88;
  const catCol  = {Commit:P.green, Probable:P.blue, Upside:P.yellow};
  const REL_ROLES = [["cio","CIO"],["cfo","CFO"],["ceo","CEO"],["owner","Owner"],["other","Other"]];
  const REL_OPTS  = [["green","🟢 Activo"],["yellow","🟡 Inactivo"],["red","🔴 Sin rel."],["none","⚪ N/A"]];

  return (
    <>
      {/* Deal selector */}
      <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:16}}>
        {rtc.map(x => {
          const xss = Object.values(x.strat).reduce((a,v)=>a+v,0);
          const xos = Object.values(x.oper).reduce((a,v)=>a+v,0);
          const xts = xss+xos;
          const isSel = sel===x.id;
          return (
            <button key={x.id} onClick={()=>setSel(x.id)} style={{
              padding:"8px 16px",borderRadius:8,cursor:"pointer",fontSize:12,fontWeight:600,
              background:isSel?P.dark:P.white, color:isSel?"#fff":P.text,
              border:`1px solid ${isSel?P.dark:P.border}`,
              boxShadow:isSel?"0 2px 8px rgba(0,0,0,.15)":"none",
            }}>
              {x.acc.split(" ").slice(0,2).join(" ")}
              <span style={{marginLeft:6,fontSize:10,opacity:.8,
                color:isSel?"#ddd":catCol[x.cat]}}>{x.cat}</span>
              {xts>0 && <span style={{marginLeft:6,fontSize:10,
                background:isSel?"rgba(255,255,255,.2)":P.bg2,
                color:isSel?"#fff":pc((xts/MAX)*100),
                padding:"1px 5px",borderRadius:8}}>{Math.round(xts)}</span>}
            </button>
          );
        })}
      </div>

      {/* Header del deal con score gauge */}
      <Card style={{borderTop:`4px solid ${catCol[d.cat]||P.blue}`}}>
        <div style={{display:"grid",gridTemplateColumns:"1fr auto",gap:20,alignItems:"start"}}>
          <div>
            <div style={{display:"grid",gridTemplateColumns:"2fr 1fr 1fr 2fr",gap:16,marginBottom:16}}>
              <div><div style={{fontSize:10,color:P.muted,fontWeight:600,textTransform:"uppercase",letterSpacing:.4}}>Account</div>
                <b style={{fontSize:15}}>{d.acc}</b></div>
              <div><div style={{fontSize:10,color:P.muted,fontWeight:600,textTransform:"uppercase",letterSpacing:.4}}>ACV (k USD)</div>
                <b style={{fontSize:15,color:P.blue}}>{n(d.acv)}</b></div>
              <div><div style={{fontSize:10,color:P.muted,fontWeight:600,textTransform:"uppercase",letterSpacing:.4}}>Closing</div>
                <b style={{fontSize:15}}>{d.dt}</b></div>
              <div><div style={{fontSize:10,color:P.muted,fontWeight:600,textTransform:"uppercase",letterSpacing:.4}}>Partner</div>
                <b>{d.partner}</b></div>

            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
              <div>
                <div style={{fontSize:11,color:P.muted,marginBottom:4}}>Strategy Score</div>
                <HBar value={ss} max={64} color={P.blue} height={10}/>
                <div style={{fontSize:11,marginTop:4}}><b style={{color:P.blue}}>{Math.round(ss)}</b><span style={{color:P.muted}}>/64</span></div>
              </div>
              <div>
                <div style={{fontSize:11,color:P.muted,marginBottom:4}}>Operative Score</div>
                <HBar value={os} max={24} color={P.teal} height={10}/>

              </div>
            </div>
          </div>
          <div style={{textAlign:"center",minWidth:160}}>
            <div style={{fontSize:10,color:P.muted,fontWeight:700,textTransform:"uppercase",letterSpacing:.4,marginBottom:4}}>Overall Score</div>
            <SemiGauge score={ts} max={MAX} size={160}/>
            <div style={{fontSize:11,color:P.muted,marginTop:2}}>
              {ts>=60?"● Alto":""}
              {ts>=30&&ts<60?"● Medio":""}
              {ts<30?"● Bajo":""}
            </div>
          </div>
        </div>
      </Card>

      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14}}>
        <Card>
          <H2>8 Criteria for Success</H2>
          {Object.entries(CRITERIA).map(([k,{label,opts}]) => {
            const v = d.strat[k];
            const maxS = Math.max(...opts.map(o=>o.s));
            return (
              <div key={k} style={{marginBottom:11}}>
                <div style={{display:"flex",justifyContent:"space-between",marginBottom:3}}>
                  <div style={{fontSize:11,fontWeight:600}}>{label}</div>
                  <span style={{fontSize:10,color:v===maxS?P.green:v>0?P.yellow:P.muted,fontWeight:700}}>
                    {v}pts
                  </span>
                </div>
                <Sel style={{width:"100%"}} value={v} onChange={e=>updS(k,e.target.value)}>
                  {opts.map(o=><option key={o.l} value={o.s}>{o.l} ({o.s}pts)</option>)}
                </Sel>
                <div style={{marginTop:4}}>
                  <HBar value={v} max={maxS} color={v===maxS?P.green:v>0?P.yellow:P.border} height={4}/>
                </div>
              </div>
            );
          })}
        </Card>
        <Card>
          <H2>Operative Criteria</H2>
          {Object.entries(OPERATIVE).map(([k,{label,opts}]) => {
            const v = d.oper[k];
            const maxS = Math.max(...opts.map(o=>o.s));
            return (
              <div key={k} style={{marginBottom:11}}>
                <div style={{display:"flex",justifyContent:"space-between",marginBottom:3}}>
                  <div style={{fontSize:11,fontWeight:600}}>{label}</div>
                  <span style={{fontSize:10,color:v===maxS?P.green:v>0?P.yellow:P.muted,fontWeight:700}}>
                    {v}pts
                  </span>
                </div>
                <Sel style={{width:"100%"}} value={v} onChange={e=>updO(k,e.target.value)}>
                  {opts.map(o=><option key={o.l} value={o.s}>{o.l} ({o.s}pts)</option>)}
                </Sel>
                <div style={{marginTop:4}}>
                  <HBar value={v} max={maxS} color={v===maxS?P.green:v>0?P.yellow:P.border} height={4}/>
                </div>
              </div>
            );
          })}
        </Card>
      </div>

      {/* Relationship Map */}
      <Card>
        <H2>Relationship Map</H2>
        <div style={{overflowX:"auto"}}>
          <table style={{borderCollapse:"collapse",minWidth:500}}>
            <thead><tr>
              <Th>Rol</Th>
              {REL_OPTS.map(([c,l])=><Th key={c} align="center">{l}</Th>)}
            </tr></thead>
            <tbody>
              {[...REL_ROLES,["sponsor","Sponsor"]].map(([k,lbl]) => (
                <tr key={k}>
                  <Td style={{fontWeight:700}}>{lbl}</Td>
                  {REL_OPTS.map(([c]) => (
                    <Td key={c} style={{textAlign:"center"}}>
                      <input type="radio" name={`${d.id}_${k}`}
                        checked={(k==="sponsor"?d.sponsor:d.rel[k])===c}
                        onChange={()=>k==="sponsor"?upd("sponsor",c):updR(k,c)}
                        style={{cursor:"pointer",transform:"scale(1.3)"}}/>
                    </Td>
                  ))}
                </tr>
              ))}
            </tbody>
          </table>
        </div>
        <div style={{marginTop:14,display:"flex",gap:16}}>
          {[["valCust","Validado con cliente"],["valPartner","Validado con partner"]].map(([f,lbl]) => (
            <label key={f} style={{fontSize:12,display:"flex",alignItems:"center",gap:8}}>
              <span style={{fontWeight:600}}>{lbl}:</span>
              <Sel value={d[f]} onChange={e=>upd(f,e.target.value)}>
                <option>SI</option><option>NO</option>
              </Sel>
            </label>
          ))}
        </div>
      </Card>

      {/* Roadmap */}
      <Card>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
          <H2 style={{margin:0}}>Roadmap to Close</H2>
          <button onClick={addRow}
            style={{background:P.blue,color:"#fff",border:"none",borderRadius:6,
              padding:"6px 12px",cursor:"pointer",fontSize:12,fontWeight:600}}>
            + Agregar actividad
          </button>
        </div>
        <div style={{marginBottom:12,display:"flex",alignItems:"center",gap:10,fontSize:12}}>
          <span style={{fontWeight:600}}>Backup deal:</span>
          <Inp style={{width:240}} type="text" value={d.backup}
            placeholder="Nombre del deal backup..." onChange={e=>upd("backup",e.target.value)}/>
        </div>
        <div style={{overflowX:"auto"}}>
          <table style={{width:"100%",borderCollapse:"collapse"}}>
            <thead><tr>
              {["Fecha","Tema","Actividad","Owner","Status"].map(h=><Th key={h}>{h}</Th>)}
            </tr></thead>
            <tbody>
              {d.roadmap.map((r,i) => {
                const statusColor = {Hecho:P.green,Bloqueado:P.red,"En proceso":P.yellow,Pendiente:P.muted,"":P.muted};
                return (
                  <tr key={i}>
                    <Td><Inp style={{width:85}}  type="text" value={r.date}     onChange={e=>updRM(i,"date",e.target.value)}/></Td>
                    <Td><Inp style={{width:115}} type="text" value={r.topic}    onChange={e=>updRM(i,"topic",e.target.value)}/></Td>
                    <Td><Inp style={{width:210}} type="text" value={r.activity} onChange={e=>updRM(i,"activity",e.target.value)}/></Td>
                    <Td><Inp style={{width:105}} type="text" value={r.owner}    onChange={e=>updRM(i,"owner",e.target.value)}/></Td>
                    <Td>
                      <Sel value={r.status} onChange={e=>updRM(i,"status",e.target.value)}
                        style={{borderLeft:`3px solid ${statusColor[r.status]||P.border}`}}>
                        {["","Pendiente","En proceso","Hecho","Bloqueado"].map(s=><option key={s}>{s}</option>)}
                      </Sel>
                    </Td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      </Card>
    </>
  );
}

// ── APP ───────────────────────────────────────────────────────
function App() {
  const [tab, setTab]  = useState("ytd");
  const [q4i, setQ4i]  = useState({ nnu:{low:0,verbal:0,high:0}, pub:{low:0,verbal:0,high:0}, ai:{low:0,verbal:0,high:0}, lin:{} });
  const [q1i, setQ1i]  = useState({ nnu:{low:0,verbal:0,high:0} });
  const [gp,  setGp]   = useState(INIT_GP);
  const [rtc, setRtc]  = useState(makeRTC());

  const TABS = [
    {id:"ytd", l:"YTD Results"},{id:"q4fc",l:"Forecast Q4"},
    {id:"q1fc",l:"Forecast Q1'27"},{id:"fy",l:"Full Year"},
    {id:"pipe",l:"Pipeline"},{id:"lob",l:"LoB Performance"},
    {id:"gp",l:"Game Plan"},{id:"rtc",l:"Roadmap to Close"},
  ];
  const ytdPct = pct(YTD_ROWS[0].ytda, YTD_ROWS[0].ytdq);

  return (
    <div style={{fontFamily:"Arial,Helvetica,sans-serif",background:P.bg,minHeight:"100vh",color:P.text}}>

      {/* ── HEADER ── */}
      <div style={{background:`linear-gradient(135deg, ${P.navy} 0%, #2C4A6E 100%)`,
        color:"#fff",padding:"0 28px"}}>
        {/* Barra de logo */}
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",
          padding:"12px 0",borderBottom:"1px solid rgba(255,255,255,.1)"}}>
          <SAPLogo size={32}/>
          <div style={{fontSize:10,opacity:.5,letterSpacing:1.5,textTransform:"uppercase"}}>
            Quarterly Business Review · {VENDOR.q}
          </div>
        </div>
        {/* Info principal */}
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",
          flexWrap:"wrap",gap:12,padding:"16px 0"}}>
          <div>
            <div style={{fontSize:20,fontWeight:800,letterSpacing:-.3}}>{VENDOR.name}</div>
            <div style={{fontSize:12,opacity:.7,marginTop:3}}>
              {VENDOR.role} · {VENDOR.seg}
            </div>
          </div>
          <div style={{display:"flex",gap:20,alignItems:"center",flexWrap:"wrap"}}>
            <div style={{textAlign:"center"}}>
              <div style={{fontSize:10,opacity:.5,fontWeight:600,letterSpacing:.5}}>FLSM</div>
              <div style={{fontWeight:700,fontSize:13}}>{VENDOR.flsm}</div>
            </div>
            <div style={{width:1,height:36,background:"rgba(255,255,255,.15)"}}/>
            {/* Mini KPIs en header */}
            {[
              {l:"YTD N&U", v:`${ytdPct}%`, c:pc(ytdPct)},
              {l:"Q4 Quota", v:`${n(Q4Q.nnu)}k`, c:"#fff"},
              {l:"FY Quota", v:`${n(FY_QUOTA)}k`, c:"#fff"},
            ].map(k => (
              <div key={k.l} style={{textAlign:"center",
                background:"rgba(255,255,255,.08)",borderRadius:6,padding:"8px 14px"}}>
                <div style={{fontSize:9,opacity:.6,fontWeight:600,letterSpacing:.5,textTransform:"uppercase"}}>{k.l}</div>
                <div style={{fontWeight:800,fontSize:16,color:k.c,marginTop:2}}>{k.v}</div>
              </div>
            ))}
          </div>
        </div>
      </div>

      {/* ── TABS ── */}
      <div style={{background:P.white,borderBottom:`2px solid ${P.border}`,
        display:"flex",paddingLeft:20,overflowX:"auto",position:"sticky",top:0,zIndex:10,
        boxShadow:"0 2px 6px rgba(0,0,0,.06)"}}>
        {TABS.map(t => (
          <div key={t.id} onClick={()=>setTab(t.id)} style={{
            padding:"12px 18px",cursor:"pointer",whiteSpace:"nowrap",fontSize:12,fontWeight:600,
            borderBottom:`3px solid ${tab===t.id?P.blue:"transparent"}`,
            color:tab===t.id?P.blue:P.muted, marginBottom:-2,
            transition:"color .15s, border-color .15s",
          }}>{t.l}</div>
        ))}
      </div>

      {/* ── CONTENIDO ── */}
      <div style={{maxWidth:1180,margin:"0 auto",padding:"20px 20px 40px"}}>
        {tab==="ytd"  && <YTDTab/>}
        {tab==="q4fc" && <ForecastTab
          title="Q4 2026 – Cloud Forecast"
          rows={[{key:"nnu",label:"N&U",quota:Q4Q.nnu},{key:"pub",label:"Public Gate",quota:Q4Q.pub},{key:"ai",label:"AI Gate",quota:Q4Q.ai}]}
          inputs={q4i} setInputs={setQ4i} showLinearity/>}
        {tab==="q1fc" && <ForecastTab
          title="Q1 2027 – Forecast Upside"
          rows={[{key:"nnu",label:"N&U",quota:Q127Q.nnu,note:"+30% sobre Q1 2026"}]}
          inputs={q1i} setInputs={setQ1i}/>}
        {tab==="fy"   && <FYTab q4i={q4i}/>}
        {tab==="pipe" && <PipelineTab/>}
        {tab==="lob"  && <LoBTab/>}
        {tab==="gp"   && <GPTab gp={gp} setGp={setGp}/>}
        {tab==="rtc"  && <RTCTab rtc={rtc} setRtc={setRtc}/>}
      </div>

      {/* ── FOOTER ── */}
      <div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:16,
        padding:"14px 28px",borderTop:`1px solid ${P.border}`,background:P.white}}>
        <SAPLogo size={20}/>
        <span style={{fontSize:10,color:P.muted}}>
          Vista individual · Datos pre-cargados por Ops · SAP Corporate Field LAC Q4 2026
        </span>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
</body>
</html>
